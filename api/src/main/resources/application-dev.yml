spring:

  datasource:
    url: jdbc:postgresql://localhost:5433/tierrating?SCHEMA=tierrating
    driver-class-name: org.postgresql.Driver
    username: tierrating
    password: ${DB_PASSWORD:testingPW}

  jpa:
    hibernate:
      ddl-auto: update

  sql:
    init:
      mode: never

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:dev-secret-key-change-in-production}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

server:
  servlet:
    context-path: "/api"

logging:
  level:
    at.pcgamingfreaks: debug

sync:
  interval: "0 0 */4 * * *"

